[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-codex-router"
version = "0.1.0"
description = "One local OpenAI-compatible-model endpoint for Claude Code and Codex: agent-team routing across your own model APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
cc-codex-router = "cc_codex_router.__main__:main"
# Backward compatibility: keep the old entry point working for existing installs.
claude-team-router = "cc_codex_router.__main__:main"

[tool.setuptools.packages.find]
include = ["cc_codex_router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
