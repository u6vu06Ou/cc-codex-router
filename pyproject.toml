[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-team-router"
version = "0.1.0"
description = "One local Anthropic-compatible endpoint that routes Claude Code agent teams across your own model APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
claude-team-router = "claude_team_router.__main__:main"

[tool.setuptools.packages.find]
include = ["claude_team_router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
